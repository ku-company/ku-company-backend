name: ZAP Baseline Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  zap:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: hackme
          POSTGRES_DB: mydatabase
        options: >-
          --health-cmd "pg_isready -U admin -d mydatabase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      NODE_ENV: test
      PORT: 8000
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DOCKER_DATABASE_URL: ${{ secrets.DOCKER_DATABASE_URL }}
      CLIENT_URL_DEV: ${{ secrets.CLIENT_URL_DEV }}
      SECRET_KEY: ${{ secrets.SECRET_KEY}}
      REFRESH_KEY: ${{ secrets.REFRESH_KEY}}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID}}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET}}
      GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL}}
      ACCESS_KEY: ${{ secrets.ACCESS_KEY}}
      SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY}}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME}}
      RESUME_BUCKET_NAME: ${{ secrets.RESUME_BUCKET_NAME}}
      BUCKET_REGION: ${{ secrets.BUCKET_REGION}}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY}}
      ZAP_TARGET_URL: http://host.docker.internal:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npm run db:migrate:deploy

      - name: Build API
        run: npm run build

      - name: Start API in background
        run: |
          nohup npm start >/tmp/server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/ >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 5
          done
          echo "API did not start in time"
          cat /tmp/server.log
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.ZAP_TARGET_URL }}
          cmd_options: >-
            -a
            -m 5
          allow_issue_writing: false
          fail_action: false

      - name: Print API logs on failure
        if: failure()
        run: cat /tmp/server.log

      - name: Stop API
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
