name: ZAP Multi-Role Scan

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        role: [Admin, Student, Company, Professor]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORT: 8000
      ZAP_TARGET_URL: http://localhost:8000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate:deploy

      - name: Seed CI users
        run: node scripts/seed-ci-users.js

      - name: Generate JWTs
        id: gen
        run: |
          node scripts/gen-jwts.js > tokens.json
          echo "ZAP_JWT=$(jq -r '.${{ matrix.role }}' tokens.json)" >> $GITHUB_ENV

      - name: Start server
        run: |
          nohup npm start >/tmp/server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8000 >/dev/null; then exit 0; fi
            sleep 3
          done
          cat /tmp/server.log
          exit 1

      - name: Run ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.ZAP_TARGET_URL }}
          cmd_options: |
            -a
            --authheader "Authorization"
            --authvalue "Bearer ${{ env.ZAP_JWT }}"
          fail_action: false
        continue-on-error: true

      - name: Upload report per role
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ matrix.role }}
          path: zap_report.html

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) || true
